{% extends "default.html" %}
{% block header %}Create a Job{% endblock %}
{% block content %}
<div class="user-input-div">
    <h1>Create a CV</h1>
    <!--We need only the CVC Dataclass-->
    <form action="" method="post" enctype="multipart/form-data">
        <label for="cvcs">CVC's: </label>
        <input type="file" name="cvcs" id="cvcs" multiple accept=".py" required>
        <div class="send-spacer"></div>
        <input type="submit">
    </form>
</div>
{% endblock %}
