{% extends "default.html" %}
{% block title %}Jobslist ({{ ammount }} results){% endblock %}
{% block content %}
<div class="user-input-div">
<h1>Jobslist ({{ ammount }} results)</h1>
<table>
    <tr>
        <th>Jobs</th>
    </tr>
    {% for job in jobs %}
    <tr>
        <td>{{ job['id'] }}</td>
        <td>{{ job['company']}}</td>
        <td>{{ job['title'] }}</td>
        <td>{{ job['state'] }}</td>
        <td>
            <form action="jobs/read/{{ job['id'] }}" method="get">
                <input type="submit" value="view">
            </form>
        </td>

        <td>
            <form action="jobs/update/{{ job['id'] }}" method="get">
                <input type="submit" value="update">
            </form>
        </td>

        <td>
            <form action="jobs/delete/{{ job['id'] }}" method="post">
                <input type="submit" value="delete">
            </form>
        </td>
        
    </tr>
    {% endfor %}
</table>
</div>
{% endblock %}
