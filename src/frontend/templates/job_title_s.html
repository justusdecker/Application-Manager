{% extends "default.html" %}
{% block title %}Jobs{% endblock %}
{% block header %}Jobslist{% endblock %}
{% block content %}
<div class="user-input-div">
<form action="job_titles/create" method="get">
    <button type="submit" class="btn-create"><span class="material-symbols-outlined">add_ad</span></button>
</form>
<table>
    <tr>
        <th>Jobs</th>
    </tr>
    {% for job in jobs %}
    <tr>
        <td>{{ job.id }}</td>
        <td>{{ job.name }}</td>
        <td>
            <form action="job_titles/update/{{ job.id }}" method="get">
                <button type="submit" class="btn-update"><span class="material-symbols-outlined">update</span></button>
            </form>
        </td>

        <td>
            <form action="job_titles/delete/{{ job.id }}" method="post">
                <button type="submit" class="btn-delete"><span class="material-symbols-outlined">delete</span></button>
            </form>
        </td>
        
    </tr>
    {% endfor %}
</table>
</div>
{% endblock %}
