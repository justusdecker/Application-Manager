{% extends "default.html" %}
{% block title %}Job{% endblock %}
{% block header %}Job{% endblock %}
{% block content %}
<div class="user-input-div">
<table>
    <tr>
        <th>Key</th>
        <th>Value</th>
    </tr>
    {% for key in values %}
    <tr>
        
        <td>{{ key }}</td>
        <td>{{ values[key] }}</td>
        
    </tr>
    {% endfor %}
    <tr>
        <td>tags</td>
        <td>
            {% for t, c in tags %}
            <b style="background-color: {{ c }};">{{ t }}</b>
            {% endfor %}
        </td>
    </tr>
</table>
</div>
{% endblock %}
