{% extends "default.html" %}
{% block header %}About{% endblock %}
{% block content %}
<div class="user-input-div">
    {% for k1 in help %}
    <h1>{{ k1 }}</h1>
        {% for k2 in help[k1] %}
        <h2>{{ k2 }}</h2>
            {% for v in help[k1][k2] %}
            <p>{{ v }}</p>
            {% endfor %}
        {% endfor %}
    {% endfor %}
</div>
{% endblock %}
