{% extends "default.html" %}
{% block header %}LinkedIn Job{% endblock %}
{% block content %}
<div class="user-input-div">
<table>
    <tr>
        <th>key</th>
        <th>value</th>
    </tr>
    {% for key in data %}
    
    <tr>
            <td>{{ key }}</td>
            <td>{{ data[key] }}</td>
    </tr>
    {% endfor %}
    <tr>
        <td>tags</td>
        <td>
            {% for t, c in tags %}
            <b style="background-color: {{ c }};">{{ t }}</b>
            {% endfor %}
        </td>
    </tr>
</table>
</div>
{% endblock %}
