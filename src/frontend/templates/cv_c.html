{% extends "default.html" %}
{% block header %}Create a Job{% endblock %}
{% block content %}
<script src="{{ url_for('static', filename='linkedin_create_workaround.js') }}"></script>
<script src="{{ url_for('static', filename='cv.js') }}"></script>
<div class="user-input-div">
    <!--AI Input, save the output in textarea-->
    <label for="summary">Text: </label>
    <textarea name="imp_writing" id="imp_writing" style="width:45vw; height: 15vh"></textarea>
    <button onclick="write_improve()" type="submit" class="btn-create"><span class="material-symbols-outlined">add_ad</span></button>
    </form>
    <form action="", method="post" enctype="multipart/form-data">
        <label for="name">Title: </label>
        <input type="text" id="name" name="name">
        <label for="name">Profession: </label>
        <select name="profession" id="profession" required>
            {% for job in jobs %}
            <option value="{{ job['name'] }}">{{ job['name'] }}</option>
            {% endfor %}
        </select>

        <label for="summary">Text: </label>
        <textarea name="summary" id="summary" style="width:45vw; height: 50vh"></textarea>
        <br>
        <button type="submit" class="btn-create"><span class="material-symbols-outlined">add_ad</span></button>
    </form>

</div>

{% endblock %}
